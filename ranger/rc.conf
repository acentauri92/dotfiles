# ranger — customizations only.
#
# ranger loads its shipped rc.conf first and this file second (unless
# RANGER_LOAD_DEFAULT_RC=FALSE), so only the deltas belong here.

# Copy the selected file's absolute path to the system clipboard.
# ranger's own yy/yp only populate its internal register, so pasting into
# another app needs an explicit clipboard hand-off.
#   - wl-copy is Wayland; use `xclip -selection clipboard` on X11
#   - readlink -f because %f is relative to ranger's cwd, which would
#     otherwise paste as a bare filename
map yc shell echo -n "$(readlink -f %f)" | wl-copy
