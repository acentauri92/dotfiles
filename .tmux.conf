# Send prefix. Bind key is now Ctrl + a on all platforms
set-option -g prefix C-a
unbind-key C-a

# Since we have remapped the prefix, press Ctrl+a twice to send to
# some other app that needs this combination
bind-key C-a send-prefix

# Set easier window split keys
bind-key v split-window -h
bind-key h split-window -v


# Enable mouse mode (tmux 2.1 and above)
set -g mouse on

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left previous-window
bind -n S-Right next-window

# tmux popup window
bind p display-popup

# use ranger file manager in a popup window
bind f display-popup -E "ranger"

# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.tmux.conf

# Colorize the prompt to follow system
set -g default-terminal "xterm-256color"

# Change background color to white and tmux status lien to gray
set -g status-style bg=white,fg=black
set -g window-status-style bg=white,fg=black

# Highlight the active window
set -g window-status-current-style fg=black,bold,bg=color249
