# tmux config
#
# Install:
#   ln -sf ~/dotfiles/.tmux.conf ~/.tmux.conf
#   git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
#   tmux source ~/.tmux.conf   # then prefix + I inside tmux to fetch plugins (tmux-power)
#   Install the `claude-usage` binary separately to ~/.local/bin/claude-usage
#   (see https://github.com/long-910/tmux-claude-status) and configure it via
#   ~/.claude/tmux-claude-status.json
#   ~/.local/bin/tmux-git-status.sh (below) ships with this dotfiles repo and
#   needs no separate install beyond being on PATH / referenced by full path.
#
# Customizations on top of stock tmux-power:
#   - Status bar theme: tmux-power 'everforest'
#   - Hostname/user segment (left_a) is blanked out — just session name shows
#   - Left status bar gained a git branch segment (left_c) via
#     tmux-git-status.sh, showing "branch" or "branch*" (dirty) for whatever
#     directory the focused pane is in
#   - Right status bar gained a Claude Code usage segment (right_w) via
#     claude-usage short — shows 5h/7d rate-limit percentage
#   - status-interval lowered to 2s and refresh-client hooks added on
#     window/pane switch so segments (git branch, etc.) don't show stale
#     data from the previously focused pane
#   - prefix + U toggles claude-usage between percent/cost display
#   - prefix + B opens a full-screen claude-usage dashboard popup
#   - Date segment (right_z) uses "Aug 18, 2026" style instead of tmux-power's
#     default ISO format
#   - Time segment (right_y) uses 12hr format with AM/PM instead of 24hr

# Send prefix. Bind key is now Ctrl + a on all platforms
set-option -g prefix C-a
unbind-key C-a

# Since we have remapped the prefix, press Ctrl+a twice to send to
# some other app that needs this combination
bind-key C-a send-prefix

# Set easier window split keys
bind-key v split-window -h
bind-key h split-window -v


# Enable mouse mode (tmux 2.1 and above)
set -g mouse on

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left previous-window
bind -n S-Right next-window

# tmux popup window
bind p display-popup

# use ranger file manager in a popup window
bind f display-popup -E "ranger"

# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.tmux.conf

# Colorize the prompt to follow system
set -g default-terminal "xterm-256color"

# tmux-claude-status keybinds (status-right display is managed by tmux-power below)
bind U run-shell "\"/home/dheeraj/.local/bin/claude-usage\" toggle && tmux refresh-client -S"
bind B display-popup -E -w 82 -h 90% "\"/home/dheeraj/.local/bin/claude-usage\" dashboard"

# Refresh status bar quickly, and force it on window/pane switch so
# status segments (git, etc.) don't show stale info from the prior window
set -g status-interval 2
set-hook -g after-select-window 'refresh-client -S'
set-hook -g after-select-pane 'refresh-client -S'
set-hook -g pane-focus-in 'refresh-client -S'

# tmux plugin manager (TPM)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'wfxr/tmux-power'
set -g @tmux_power_theme 'everforest'
set -g @tmux_power_left_a ''
set -g @tmux_power_left_c '#(/home/dheeraj/.local/bin/tmux-git-status.sh #{pane_current_path})'
set -g @tmux_power_right_w '#(/home/dheeraj/.local/bin/claude-usage short)'
set -g @tmux_power_right_y ' %I:%M %p'
set -g @tmux_power_right_z ' %b %d, %Y'

# Initialize TPM (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
