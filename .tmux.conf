# Send prefix. Bind key is now Ctrl + a on all platforms
set-option -g prefix C-a
unbind-key C-a

# Since we have remapped the prefix, press Ctrl+a twice to send to
# some other app that needs this combination
bind-key C-a send-prefix

# Set easier window split keys
bind-key v split-window -h
bind-key h split-window -v


# Enable mouse mode (tmux 2.1 and above)
set -g mouse on

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left previous-window
bind -n S-Right next-window

# tmux popup window
bind p display-popup

# use ranger file manager in a popup window
bind f display-popup -E "ranger"

# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.tmux.conf

# Colorize the prompt to follow system
set -g default-terminal "xterm-256color"

# Change background color to white and tmux status lien to gray
set -g status-style bg=white,fg=black
set -g window-status-style bg=white,fg=black

# Highlight the active window
set -g window-status-current-style fg=black,bold,bg=color249

# Just display date and time on the status bar
set -g status-right "%H:%M %d-%b-%y"

# tmux-claude-status: https://github.com/long-910/tmux-claude-status
# Shows Claude Code session (5h) and weekly (7d) rate-limit usage in status-right.
# Install the `claude-usage` binary separately (see README.md), then this block
# just wires it into tmux. It reads/writes its own cache, no extra deps here.
#
# Customize:
#   ~/.claude/tmux-claude-status.json  - realtime polling, cache_ttl, provider override
#   claude-usage --help                - full command reference (long/json/dashboard/etc)
#   Edit the format string below to change what's shown, e.g. drop the "5h:" label
#   or add reset times - see short_percent()/short_cost() in the installed
#   ~/.local/bin/claude-usage script for the exact output format logic.
set -g status-right-length 200
set -g status-right "#(claude-usage short) | %H:%M %Y-%m-%d"
bind U run-shell "claude-usage toggle && tmux refresh-client -S"  # <prefix>+U: toggle percent/cost
bind B display-popup -E -w 82 -h 90% "claude-usage dashboard"     # <prefix>+B: full-screen dashboard
